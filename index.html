
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharkTV - Películas</title>

<style>
* { box-sizing: border-box; }

html {
    scroll-behavior: auto;
    background: #000;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 320px;
    background: #000 center / cover no-repeat;
    display: flex;
    align-items: center;
    padding: 20px;
    z-index: 999;
    overflow: hidden;
}

.header::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(to right, rgba(0,0,0,.9) 0%,
        rgba(0,0,0,.55) 35%, transparent 100%),
        linear-gradient(to bottom, transparent 35%, #000 100%);
    pointer-events: none;
}

.header-info {
    position: relative;
    z-index: 2;
    max-width: 500px;
    opacity: 0;
    transition: opacity .25s ease;
}

.header-info.visible { opacity: 1; }

.header h1 { margin: 0; }

.header h1 img {
    display: block;
    max-width: 300px;
    max-height: 80px;
    object-fit: contain;
    object-position: left center;
}

.details {
    font-size: 14px;
    font-weight: bold;
    margin: 10px 0;
    line-height: 1.7;
    max-width: 480px;
}

.overview {
    font-size: 12px;
    line-height: 1.45;
    max-width: 450px;
    margin: 8px 0 0;
}

.content {
    padding: 20px;
    margin-top: 320px;
    min-height: 200px;
}

.movie-row {
    display: grid;
    grid-template-columns: repeat(8, 105px);
    gap: 12px;
    margin-top: 15px;
    align-items: start;
}

.movie {
    display: block;
    width: 105px;
    height: 160px;
    cursor: pointer;
    outline: none;
    text-decoration: none;
    background: transparent;
    border: none;
    box-shadow: none;
    overflow: hidden;
    transform: translateZ(0);
}

.movie[hidden] { display: none !important; }

.movie img {
    display: block;
    width: 105px;
    height: 160px;
    object-fit: cover;
    border: 3px solid transparent;
    background: transparent;
    outline: none;
    box-shadow: none;
    transition: border-color .15s;
}

.movie.selected img,
.movie:focus-visible img {
    border-color: #e50914;
}

/* Sin marco gris: solo se muestra el borde rojo de selección */
.movie, .movie:focus, .movie:focus-visible, .movie.selected {
    background: transparent !important;
    outline: none !important;
    box-shadow: none !important;
}
.movie img { background: transparent !important; box-shadow: none !important; }

.search-container {
    position: fixed;
    top: 20px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1001;
}

.search-button {
    background: transparent;
    border: 0;
    padding: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    border-radius: 50%;
    transform-origin: center;
    transition: transform .2s ease;
}

.search-button svg {
    display: block;
    width: 26px;
    height: 26px;
    fill: white;
}

.search-button:hover,
.search-button:focus,
.search-button:focus-visible {
    transform: scale(1.3);
    outline: none;
}

.search-input {
    width: 0;
    min-width: 0;
    padding: 8px 0;
    border: 0;
    border-radius: 20px;
    background: rgba(0,0,0,.9);
    color: #fff;
    outline: none;
    opacity: 0;
    pointer-events: none;
    transition: width .2s, opacity .2s, padding .2s;
}

.search-input.active {
    width: 220px;
    padding: 9px 12px;
    border: 1px solid rgba(255,255,255,.5);
    opacity: 1;
    pointer-events: auto;
}

.search-input:focus {
    border-color: rgba(255,255,255,.9);
}

.status {
    color: #aaa;
    font-size: 14px;
    margin-top: 20px;
}

@media (max-width: 900px) {
    .movie-row { grid-template-columns: repeat(5, 105px); }
}

@media (max-width: 600px) {
    .header { height: 320px; padding: 15px; }

    .header h1 img {
        max-width: 240px;
        max-height: 70px;
    }

    .content {
        margin-top: 320px;
        padding: 12px;
    }

    .movie-row {
        grid-template-columns: repeat(3, 105px);
        gap: 10px;
    }

    .search-container {
        right: 15px;
        top: 15px;
    }

    .search-input.active { width: 170px; }
}
</style>
</head>

<body>

<div class="search-container">
    <button id="search-button" class="search-button"
        type="button" aria-label="Abrir buscador" tabindex="0">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5
            6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5
            4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5
            S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"/>
        </svg>
    </button>

    <input id="search" class="search-input" type="text"
        placeholder="Buscar película..." aria-label="Buscar películas"
        autocomplete="off" tabindex="0">
</div>

<div class="header" id="header">
    <div class="header-info" id="info">
        <h1 id="title"></h1>
        <div id="meta" class="details"></div>
        <p id="overview" class="overview"></p>
    </div>
</div>

<div class="content">
    <div class="movie-row" id="movie-row"></div>
    <p class="status" id="status" hidden></p>
</div>

<script>
'use strict';

const header = document.getElementById('header');
const info = document.getElementById('info');
const titleElement = document.getElementById('title');
const metaElement = document.getElementById('meta');
const overviewElement = document.getElementById('overview');
const searchInput = document.getElementById('search');
const searchButton = document.getElementById('search-button');
const movieRow = document.getElementById('movie-row');
const statusElement = document.getElementById('status');

let movies = [];
let selectedMovie = null;

/* CARGAR CATÁLOGO */

async function loadMovies() {
    statusElement.hidden = false;
    statusElement.textContent = 'Cargando contenido...';

    try {
        const response = await fetch('./peliculas.json?t=' + Date.now(), {
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const catalog = await response.json();

        if (!Array.isArray(catalog)) {
            throw new Error('El catálogo no es una lista JSON válida.');
        }

        movies = catalog;
        renderMovies();

    } catch (error) {
        console.error('Error cargando catálogo:', error);
        statusElement.hidden = false;
        statusElement.textContent =
            'No se pudo cargar peliculas.json. Comprueba que esté publicado junto a index.html.';
    }
}

/* DATOS DE CADA PELÍCULA */

function getTitle(movie) {
    return movie.title_manual ||
        movie.title ||
        movie.youtube_title ||
        'Película';
}

function getYoutubeUrl(movie) {
    if (movie.youtube_url_manual) return movie.youtube_url_manual;
    if (movie.youtube_url) return movie.youtube_url;

    if (movie.youtube_id) {
        return 'https://www.youtube.com/watch?v=' +
            encodeURIComponent(movie.youtube_id);
    }

    return '';
}

function getYear(movie) {
    if (movie.release_date) {
        return String(movie.release_date).slice(0, 4);
    }

    if (movie.year) return String(movie.year);

    const match = (movie.youtube_title || movie.title || '')
        .match(/\b(19\d{2}|20\d{2})\b/);

    return match ? match[1] : '';
}

function getRuntime(movie) {
    const runtime = Number(movie.runtime || movie.duration_minutes || 0);

    if (!runtime || runtime <= 0) return '';

    const hours = Math.floor(runtime / 60);
    const minutes = runtime % 60;

    if (hours && minutes) return hours + ' h ' + minutes + ' min';
    if (hours) return hours + ' h';

    return minutes + ' min';
}

function getGenres(movie) {
    if (Array.isArray(movie.genres)) {
        return movie.genres.map(g =>
            typeof g === 'string' ? g : (g && g.name ? g.name : '')
        ).filter(Boolean).join(', ');
    }

    if (typeof movie.genres === 'string') return movie.genres;

    return movie.genre || movie.genre_label || '';
}

function getQuality(movie) {
    if (movie.quality_manual) return movie.quality_manual;
    if (movie.quality) return movie.quality;

    const text = ((movie.youtube_title || '') + ' ' +
        (movie.description || '')).toLowerCase();

    if (/\b(4k|2160p|uhd)\b/.test(text)) return '4K';
    if (/\b(fhd|1080p|full hd)\b/.test(text)) return 'FHD';
    if (/\b(hd|720p)\b/.test(text)) return 'HD';

    return '';
}

function getAgeRating(movie) {
    return movie.age_rating_manual ||
        movie.age_rating ||
        movie.age_certification ||
        movie.certification ||
        movie.certificacion ||
        '';
}

/* CREAR CARÁTULAS */

function renderMovies() {
    movieRow.replaceChildren();
    selectedMovie = null;

    const validMovies = movies.filter(movie =>
        movie && getYoutubeUrl(movie)
    );

    if (!validMovies.length) {
        statusElement.hidden = false;
        statusElement.textContent = 'Todavía no hay películas disponibles.';
        info.classList.remove('visible');
        header.style.backgroundImage = 'none';
        titleElement.replaceChildren();
        metaElement.textContent = '';
        overviewElement.textContent = '';
        return;
    }

    statusElement.hidden = true;

    validMovies.forEach(movie => {
        const card = document.createElement('a');
        card.className = 'movie';
        card.tabIndex = 0;
        card.href = getYoutubeUrl(movie);
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        card.dataset.title = getTitle(movie);
        card.dataset.logo = movie.logo_manual || movie.logo ||
            movie.movie_logo || '';
        card.dataset.banner = movie.backdrop_manual || movie.backdrop || '';
        card.dataset.poster = movie.poster_manual || movie.poster || '';
        card.dataset.overview = movie.overview || '';
        card.dataset.year = getYear(movie);
        card.dataset.runtime = getRuntime(movie);
        card.dataset.genres = getGenres(movie);
        card.dataset.quality = getQuality(movie);
        card.dataset.age = getAgeRating(movie);

        const poster = document.createElement('img');
        poster.alt = '';
        poster.loading = 'lazy';
        poster.decoding = 'async';
        poster.draggable = false;

        if (card.dataset.poster) {
            poster.src = card.dataset.poster;
        } else {
            poster.style.visibility = 'hidden';
        }

        poster.addEventListener('error', () => {
            poster.style.visibility = 'hidden';
        });

        card.appendChild(poster);
        movieRow.appendChild(card);

        card.addEventListener('focus', () => selectMovie(card));
        card.addEventListener('mouseenter', () => selectMovie(card));
    });

    filterMovies();
}

/* BANNER Y LOGO */

function selectMovie(card) {
    if (!card || card.hidden) return;

    selectedMovie = card;

    movieRow.querySelectorAll('.movie').forEach(movie => {
        movie.classList.toggle('selected', movie === card);
    });

    const banner = card.dataset.banner;
    header.style.backgroundImage = banner
        ? 'url("' + banner.replace(/"/g, '%22') + '")'
        : 'none';

    const movieTitle = card.dataset.title || 'Película';
    const logo = card.dataset.logo;

    titleElement.replaceChildren();

    if (logo) {
        const image = document.createElement('img');
        image.src = logo;
        image.alt = movieTitle;

        image.addEventListener('error', () => {
            titleElement.replaceChildren();
            titleElement.textContent = movieTitle;
        }, { once: true });

        titleElement.appendChild(image);
    } else {
        titleElement.textContent = movieTitle;
    }

    metaElement.textContent = [
        card.dataset.year,
        card.dataset.runtime,
        card.dataset.genres,
        card.dataset.quality,
        card.dataset.age
    ].filter(Boolean).join(' | ');

    overviewElement.textContent = card.dataset.overview || '';
    info.classList.add('visible');
}

/* NAVEGACIÓN CON MANDO */

function getVisibleCards() {
    return [...movieRow.querySelectorAll('.movie:not([hidden])')];
}

function getColumns() {
    if (window.innerWidth <= 600) return 3;
    if (window.innerWidth <= 900) return 5;
    return 8;
}

function scrollToMovie(card) {
    if (!card) return;

    const rect = card.getBoundingClientRect();
    const topLimit = 325;
    const bottomLimit = window.innerHeight - 12;

    if (rect.top < topLimit) {
        window.scrollBy(0, rect.top - topLimit);
    } else if (rect.bottom > bottomLimit) {
        window.scrollBy(0, rect.bottom - bottomLimit);
    }
}

function focusMovie(card) {
    if (!card) return;

    card.focus({ preventScroll: true });
    selectMovie(card);
    scrollToMovie(card);
}

function focusFirstMovie() {
    const cards = getVisibleCards();
    if (cards.length) focusMovie(cards[0]);
}

function openSearch() {
    searchInput.classList.add('active');
    searchInput.focus();
}

function closeSearch() {
    searchInput.value = '';
    filterMovies();
    searchInput.classList.remove('active');
    searchInput.blur();
    searchButton.focus({ preventScroll: true });
}

document.addEventListener('keydown', function(event) {
    const key = event.key;
    const code = event.keyCode || event.which;

    const up = key === 'ArrowUp' || code === 38 || code === 19;
    const down = key === 'ArrowDown' || code === 40 || code === 20;
    const left = key === 'ArrowLeft' || code === 37 || code === 21;
    const right = key === 'ArrowRight' || code === 39 || code === 22;
    const enter = key === 'Enter' || code === 13 || code === 23 || code === 66;
    const escape = key === 'Escape' || code === 27 || code === 4;

    const active = document.activeElement;
    const isSearchInput = active === searchInput;
    const isSearchButton = active === searchButton;
    const activeCard = active && active.closest
        ? active.closest('.movie')
        : null;

    if (isSearchInput) {
        if (escape) {
            event.preventDefault();
            closeSearch();
            return;
        }

        if (up) {
            event.preventDefault();
            searchButton.focus({ preventScroll: true });
            return;
        }

        if (down) {
            event.preventDefault();
            focusFirstMovie();
            return;
        }

        if (enter) {
            event.preventDefault();
            focusFirstMovie();
            return;
        }

        return;
    }

    if (isSearchButton) {
        if (enter) {
            event.preventDefault();
            openSearch();
            return;
        }

        if (down) {
            event.preventDefault();
            focusFirstMovie();
            return;
        }

        if (up || left || right) {
            event.preventDefault();
            return;
        }
    }

    if (!activeCard) {
        if (up || left) {
            event.preventDefault();
            searchButton.focus({ preventScroll: true });
        } else if (down || right) {
            event.preventDefault();
            focusFirstMovie();
        }
        return;
    }

    const cards = getVisibleCards();
    const index = cards.indexOf(activeCard);
    if (index < 0) return;

    const columns = getColumns();
    let next = index;

    if (right) {
        next = Math.min(index + 1, cards.length - 1);
    } else if (left) {
        next = index % columns === 0 ? index : index - 1;
    } else if (down) {
        next = Math.min(index + columns, cards.length - 1);
    } else if (up) {
        if (index < columns) {
            event.preventDefault();
            searchButton.focus({ preventScroll: true });
            return;
        }
        next = index - columns;
    } else if (escape) {
        event.preventDefault();
        searchButton.focus({ preventScroll: true });
        return;
    } else {
        return;
    }

    event.preventDefault();
    if (cards[next]) focusMovie(cards[next]);
}, true);

/* BUSCADOR */

searchButton.addEventListener('click', openSearch);
searchInput.addEventListener('input', filterMovies);

searchInput.addEventListener('blur', () => {
    if (!searchInput.value.trim()) {
        searchInput.classList.remove('active');
    }
});

function filterMovies() {
    const query = searchInput.value.trim().toLocaleLowerCase('es');
    const cards = [...movieRow.querySelectorAll('.movie')];
    let firstMatch = null;

    cards.forEach(card => {
        const text = [
            card.dataset.title,
            card.dataset.year,
            card.dataset.genres,
            card.dataset.quality,
            card.dataset.age,
            card.dataset.overview
        ].join(' ').toLocaleLowerCase('es');

        const matches = text.includes(query);
        card.hidden = !matches;

        if (matches && !firstMatch) firstMatch = card;
    });

    if (firstMatch) {
        selectMovie(firstMatch);
    } else if (query) {
        selectedMovie = null;
        info.classList.remove('visible');
        header.style.backgroundImage = 'none';
        titleElement.replaceChildren();
        metaElement.textContent = '';
        overviewElement.textContent = '';
    }
}

window.addEventListener('resize', () => {
    if (selectedMovie && !selectedMovie.hidden) {
        selectMovie(selectedMovie);
    }
});

/* ARRANQUE: dar el foco real a la primera carátula */
async function startSharkTV() {
    await loadMovies();
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            focusFirstMovie();
        });
    });
}

startSharkTV();
</script>

</body>
</html>
